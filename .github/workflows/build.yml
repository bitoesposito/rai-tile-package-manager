name: build

# Every push and pull request runs the self-check and builds the exe; a tag vX.Y.Z also publishes it as a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Self-check
        run: dotnet run --project tests -c Release

      - name: Build
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            dotnet build src -c Release -p:Version="${GITHUB_REF_NAME#v}"
          else
            dotnet build src -c Release
          fi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "src/bin/Release/net48/Rai - Package tile manager.exe#Rai - Package tile manager.exe" --title "$GITHUB_REF_NAME" --generate-notes
