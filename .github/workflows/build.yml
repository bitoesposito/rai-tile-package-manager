name: build

# Every push and pull request runs the self-check and builds the exe, attached to the run as an artifact.
# A tag vX.Y.Z also publishes a release with a zip: GitHub turns spaces in asset names into dots,
# so the exe keeps its exact name only inside the zip.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Self-check
        run: dotnet run --project tests -c Release

      - name: Build
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            dotnet build src -c Release -p:Version="${GITHUB_REF_NAME#v}"
          else
            dotnet build src -c Release
          fi
          mkdir dist
          cp "src/bin/Release/net48/Rai - Package tile manager.exe" src/fonts/OFL.txt dist/

      - uses: actions/upload-artifact@v7
        with:
          name: rai-package-tile-manager
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rai-package-tile-manager

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j Rai-Package-tile-manager.zip "Rai - Package tile manager.exe" OFL.txt
          gh release create "$GITHUB_REF_NAME" Rai-Package-tile-manager.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
